name: Generate contribution snake

# Renders the snake that eats your contribution graph, then pushes the SVGs
# to the `output` branch (which the README reads from).
on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#7C5CFF&color_dots=#0E0E12,#3a2f6b,#5a48a8,#7C5CFF,#FF5B2E

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
